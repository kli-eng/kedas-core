name: kedas-core
services:
  postgres:
    image: postgres:16-alpine
    container_name: kedas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:          ${POSTGRES_DB:-kedas_db}
      POSTGRES_USER:        ${POSTGRES_USER:-kedas}
      POSTGRES_PASSWORD:    ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kedas} -d ${POSTGRES_DB:-kedas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - kedas-internal
    deploy:
      resources:
        limits:
          memory: 512M

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: kedas-api
    restart: unless-stopped
    environment:
      KEDAS_DATABASE_URL:    postgresql://${POSTGRES_USER:-kedas}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kedas_db}
      KEDAS_JWT_SECRET:      ${KEDAS_JWT_SECRET}
      KEDAS_INSTALL_TOKEN:   ${KEDAS_INSTALL_TOKEN}
      KEDAS_PSEUDONIMO_SALT: ${KEDAS_PSEUDONIMO_SALT}
      KEDAS_PGCRYPTO_KEY:    ${KEDAS_PGCRYPTO_KEY}
      KEDAS_ALLOWED_ORIGINS: ${KEDAS_ALLOWED_ORIGINS:-http://localhost:3000}
      KOLIBRI_DATA_PATH:     /opt/kedas/data/kolibri
      LOG_LEVEL:             ${LOG_LEVEL:-INFO}
    volumes:
      - ./api:/app/api:ro
      - /opt/kedas/data/kolibri:/opt/kedas/data/kolibri:ro
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - kedas-internal
    deploy:
      resources:
        limits:
          memory: 512M

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        PUBLIC_API_URL: /api
    container_name: kedas-frontend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - kedas-internal
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2.8.4-alpine
    container_name: kedas-caddy
    restart: unless-stopped
    environment:
      CADDY_DOMAIN:      ${CADDY_DOMAIN:-localhost}
      KEDAS_ADMIN_EMAIL: ${KEDAS_ADMIN_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - frontend
      - api
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks:
      - kedas-internal
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  kedas-internal:
    driver: bridge
